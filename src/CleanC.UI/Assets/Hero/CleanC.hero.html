const post=o=>{try{window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage(o)}catch(e){}};
const HAS_HOST=()=>!!(window.chrome&&window.chrome.webview);
/* RPC دوطرفه: هر درخواست یک id دارد و میزبان با {type:'rpc',id,ok,result} پاسخ می‌دهد */
let __rid=0;const __rq={};
function rpc(type,payload,ms){
 return new Promise((res,rej)=>{
  if(!HAS_HOST()){rej(new Error('no-host'));return}
  const id=++__rid;
  const to=setTimeout(()=>{if(__rq[id]){delete __rq[id];rej(new Error('rpc timeout'))}},ms||180000);
  __rq[id]={res,rej,to};
  post(Object.assign({type,id},payload||{}));
 });
}
function rpcReply(d){const p=__rq[d.id];if(!p)return;delete __rq[d.id];clearTimeout(p.to);d.ok?p.res(d.result):p.rej(new Error(d.error||'host error'))}

   else if(/^\s*[\d.,]+\s*(مگابایت|گیگابایت|کیلوبایت|MB|GB|KB)/i.test(it[1]))
    it[1]=fmt(b/1048576)+it[1].replace(/^\s*[\d.,]+\s*(مگابایت|گیگابایت|کیلوبایت|MB|GB|KB)\s*/i,' ');

function queueBubble(t,urgent){

const FOUND=new Set(LS.g('cc_found',[]));
function found(id){if(!NAMES[id]||(RI[id]&&RI[id].col===false)||FOUND.has(id))return;FOUND.add(id);LS.s('cc_found',[...FOUND])}

function pickR(g){const pool=R.filter(r=>r.g==g),w={0:70,1:25,2:4,3:1},av=[...new Set(pool.map(r=>r.r))];let roll=Math.random()*av.reduce((a,r)=>a+w[r],0),pr=av[0];for(const r of av){roll-=w[r];if(roll<=0){pr=r;break}}
 let c=pool.filter(r=>r.r==pr&&!recent.includes(r.id));if(!c.length)c=pool.filter(r=>r.r==pr);return c[Math.random()*c.length|0]}
const rxOK=()=>!run&&!(cur&&(cur.fast||cur.crit)),calmTier=()=>cur&&!cur.fast&&!cur.warn&&!cur.crit&&cur.id!='sleep'&&cur.id!='drowsy'&&!MR();
