const post=o=>{try{window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage(o)}catch(e){}};
const HAS_HOST=()=>!!(window.chrome&&window.chrome.webview);
/* RPC دوطرفه: هر درخواست یک id دارد و میزبان با {type:'rpc',id,ok,result} پاسخ می‌دهد */
let __rid=0;const __rq={};
function rpc(type,payload,ms){
 return new Promise((res,rej)=>{
  if(!HAS_HOST()){rej(new Error('no-host'));return}
  const id=++__rid;
  const to=setTimeout(()=>{if(__rq[id]){delete __rq[id];rej(new Error('rpc timeout'))}},ms||180000);
  __rq[id]={res,rej,to};
  post(Object.assign({type,id},payload||{}));
 });
}
function rpcReply(d){const p=__rq[d.id];if(!p)return;delete __rq[d.id];clearTimeout(p.to);d.ok?p.res(d.result):p.rej(new Error(d.error||'host error'))}

async function getLoc(){const nm=ST.city,c=LS.g('cc_loc',null);if(c&&c.q==nm)return c;let r;
 if(nm){const j=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fa&name='+encodeURIComponent(nm))).json(),g=j.results&&j.results[0];if(!g)throw 0;r={q:nm,lat:g.latitude,lon:g.longitude,name:g.name||nm}}
 else{const j=await(await fetch('https://ipwho.is/')).json();if(!j.success)throw 0;r={q:'',lat:j.latitude,lon:j.longitude,name:j.city}}
 LS.s('cc_loc',r);return r}
async function loadWeather(){if(ST.offline)return;try{const c=LS.g('cc_w',null);if(c&&Date.now()-c.at<18e5&&c.q==ST.city){Object.assign(W,c.w,{ok:1});newHL();return}

 const w={t:Math.round(k.temperature_2m),code:k.weather_code,day:k.is_day,wind:k.wind_speed_10m,city:l.name};Object.assign(W,w,{ok:1});LS.s('cc_w',{at:Date.now(),q:ST.city,w});newHL()}catch(e){}}
function wBucket(){const c=W.code,t=W.t;if(c>=95)return'storm';if((c>=71&&c<=77)||c==85||c==86)return'snow';if((c>=51&&c<=67)||(c>=80&&c<=82))return'rain';if(c==45||c==48)return'fog';if(t>=35)return'hot';if(t<=0)return'freeze';if(W.wind>=40)return'wind';if(t<=8)return'cold';if(c<=1)return W.day?'clearD':'clearN';if(c>=2)return'cloud';return'mild'}

function pickLine(pool){if(!pool)return null;const c=(pool[TI()]||'').split('|').map(fill).filter(s=>s&&!used.includes(s));if(!c.length)return null;const s=c[Math.random()*c.length|0];used.push(s);if(used.length>30)used.shift();return s}
